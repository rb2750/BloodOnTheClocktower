name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Character art is fetched rather than committed, so the build needs it
      # before it can produce a complete bundle. It is cached between runs
      # because it changes only when The Pandemonium Institute publish new art.
      - name: Cache character art
        uses: actions/cache@v4
        with:
          path: apps/*/public/art
          key: botc-art-${{ hashFiles('packages/rules/data/characters.json') }}

      - run: pnpm art

      - run: pnpm test

      - run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm e2e
        env:
          CI: 'true'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
